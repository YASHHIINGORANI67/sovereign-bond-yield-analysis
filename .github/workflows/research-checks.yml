name: Sovereign risk research checks

on:
  push:
    paths:
      - 'bond_yield_data.csv'
      - 'tests/**'
      - 'validate_model.py'
      - 'requirements.txt'
      - '.github/workflows/research-checks.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Dataset unit tests
        run: python -m unittest discover -s tests -v
      - name: CSV-based OLS diagnostics
        run: python validate_model.py
